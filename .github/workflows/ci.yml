name: CRA Kernel Automated Integrity Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PYTHONUNBUFFERED: "1"

jobs:
  kernel_harness_audit:
    name: Execute Zero-Trust Verification Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Runtime Repository Code
      uses: actions/checkout@v4

    - name: Instantiate Verified Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Run Static Code Integrity Validations
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Full Containment Testing Suite
      run: python harness.py
